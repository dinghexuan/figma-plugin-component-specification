<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主题化配置器</title>
  <style>@font-face { font-family: "Theme MiSans"; src: local("MiSans Medium"), local("MiSans-Medium"); font-weight: 400; }
@font-face { font-family: "Theme MiSans"; src: local("MiSans Demibold"), local("MiSans-Demibold"); font-weight: 600; }
@font-face { font-family: "Theme MiSans Regular"; src: local("MiSans Regular"), local("MiSans-Regular"); }
:root {
  --primary: #ff6000;
  --text: #1f2633;
  --secondary: #445064;
  --tertiary: #59667d;
  --border: #e5e9f0;
  --background: #fcfeff;
  --card: #f7f9fa;
  font-family: "Theme MiSans", MiSans, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--background);
}
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button { border: 0; background: transparent; padding: 0; }
button:focus-visible, select:focus-visible, .color-square:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { height: var(--window-height, 100vh); display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--background); }
.icon-button { display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 6px; }
.icon-button:hover { background: rgba(0, 34, 102, .05); }
.tabs { height: 50px; flex: none; display: flex; align-items: flex-start; gap: 28px; padding-bottom: 8px; }
.tabs button { height: 42px; padding: 10px 4px; line-height: 22px; border-bottom: 2px solid transparent; color: var(--secondary); }
.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
.mode-wrap { height: 40px; padding-bottom: 8px; flex: none; }
.segmented { display: flex; height: 32px; padding: 3px; gap: 4px; border-radius: 6px; background: rgba(0, 34, 102, .05); }
.segmented button { flex: 1; line-height: 22px; border-radius: 6px; color: var(--secondary); }
.segmented button.active { background: #fff; }
.viewport { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: -12px -16px -12px -12px; padding: 12px 16px 12px 12px; scrollbar-width: thin; scrollbar-color: #dce2ed transparent; }
.viewport::-webkit-scrollbar { width: 6px; }
.viewport::-webkit-scrollbar-thumb { border-radius: 8px; background: #dce2ed; }
.panels { width: 368px; display: flex; flex-direction: column; gap: 8px; }
.panel { flex: none; padding: 16px; border: 1px solid #fff; border-radius: 10px; background: var(--card); box-shadow: 0 4px 16px 4px rgba(0, 38, 77, .08); }
.panel.color-panel:not(:first-child):not(.expanded) { min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
.panels.has-expanded .panel.color-panel:not(.expanded) { min-height: 62px; }
.size-panel { min-height: 72px; padding: 15px 16px; }
.size-panel:nth-child(-n+2) { min-height: 74px; padding: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.expand { flex: 1; min-width: 0; display: flex; align-items: flex-start; text-align: left; }
.arrow { width: 14px; flex: none; padding-top: 6px; display: flex; justify-content: center; }
.arrow img { transition: transform .15s; }
.expanded .arrow img { transform: rotate(90deg); }
.head-title { font-weight: 400; line-height: 22px; white-space: nowrap; }
.head-subtitle { display: block; font-size: 12px; line-height: 18px; color: var(--tertiary); }
.field { display: flex; align-items: center; gap: 8px; flex: none; }
.value-input { width: 96px; height: 28px; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font-size: 12px; line-height: 18px; color: var(--secondary); outline: none; }
.value-input:focus { border-color: var(--primary); }
.value-input[aria-invalid="true"] { border-color: #ed182a; }
.value-input:read-only { cursor: default; }
.swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: linear-gradient(45deg, #e5e9f0 25%, transparent 25%, transparent 75%, #e5e9f0 75%), linear-gradient(45deg, #e5e9f0 25%, #fff 25%, #fff 75%, #e5e9f0 75%); background-size: 8px 8px; background-position: 0 0, 4px 4px; overflow: hidden; }
.swatch > span { display: block; width: 100%; height: 100%; }
.panel-head .swatch { border-color: transparent; }
.token-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.token-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 28px; }
.token-label { padding-left: 14px; color: var(--tertiary); font-size: 12px; line-height: 18px; display: flex; align-items: center; min-width: 0; gap: 12px; }
.token-name { white-space: nowrap; }
.reset { color: var(--primary); font-size: 12px; line-height: 18px; flex: none; }
.reset:hover { text-decoration: underline; }
.number-row .token-label { flex: 1; }
.seed-row { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-top: 8px; font-size: 12px; color: var(--tertiary); padding-left: 14px; }
.padding-panel { margin-top: 12px; padding: 12px 0 0; border: 0; border-top: 1px solid var(--border); border-radius: 0; box-shadow: none; }
footer { width: 368px; height: 52px; margin-top: 8px; padding-top: 12px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
footer button { height: 40px; border: 1px solid var(--border); padding: 0 16px; border-radius: 8px; font-size: 16px; line-height: 24px; color: var(--secondary); }
footer button:hover { border-color: #ff6000; }
footer .primary { background: var(--primary); border-color: transparent; color: #fff; }
footer .primary:hover { background: #eb5800; }
footer .primary:disabled { background: var(--primary); opacity: .6; }
.notice { position: fixed; bottom: 70px; left: 16px; right: 16px; z-index: 20; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; box-shadow: 0 4px 16px rgba(0, 38, 77, .12); font-size: 12px; line-height: 18px; color: var(--secondary); }
.notice.error { color: #c81525; border-color: #f6b9c0; }
.picker { position: fixed; z-index: 30; width: 256px; padding: 15.5px; border: .5px solid rgba(255, 255, 255, .1); border-radius: 10px; box-shadow: 0 4px 16px 2px rgba(0, 26, 51, .08); background: #fff; display: flex; flex-direction: column; gap: 12px; }
.color-square { width: 224px; height: 224px; border-radius: 6px; position: relative; touch-action: none; cursor: crosshair; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), var(--hue, red); }
.square-handle { position: absolute; width: 16px; height: 16px; border-radius: 100px; border: 1px solid #cfd0d2; background: #fff; box-shadow: 2px 2px 3px rgba(0, 0, 0, .3); transform: translate(-50%, -50%); pointer-events: none; }
.picker-sliders { display: flex; gap: 12px; align-items: center; }
.slider-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.hue-track, .alpha-track { height: 12px; border-radius: 8px; position: relative; }
.hue-track { background: linear-gradient(90deg, #f00 0%, #f90 10%, #cf0 20%, #3f0 30%, #0f6 40%, #0ff 50%, #06f 60%, #30f 70%, #c0f 80%, #f09 90%, #ff0004 100%); }
.alpha-track { border: 1px solid var(--border); background-image: linear-gradient(to right, transparent, var(--picker-color, #fff)), conic-gradient(#e5e9f0 25%, #fff 0 50%, #e5e9f0 0 75%, #fff 0); background-size: auto, 8px 8px; }
.slider-stack input { appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 12px; margin: 0; background: transparent; cursor: pointer; }
.slider-stack input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border: 4px solid rgba(255, 255, 255, .9); border-radius: 100px; box-shadow: 1px 1px 4px rgba(0, 0, 0, .3); background: transparent; }
.slider-stack input::-moz-range-thumb { width: 8px; height: 8px; border: 4px solid rgba(255, 255, 255, .9); border-radius: 100px; box-shadow: 1px 1px 4px rgba(0, 0, 0, .3); background: transparent; }
.alpha-track input::-webkit-slider-thumb { background: #fff; }
.eyedropper { width: 26px; height: 26px; padding: 4px; border-radius: 4px; flex: none; }
.picker-controls { display: flex; gap: 12px; align-items: center; }
.format-select { width: 64px; height: 28px; position: relative; flex: none; border: 1px solid #d3d9e3; border-radius: 6px; }
.format-select select { width: 100%; height: 100%; appearance: none; background: transparent; border: 0; padding: 5px 22px 5px 9px; font-size: 12px; line-height: 18px; color: var(--secondary); cursor: pointer; }
.format-select img { position: absolute; right: 8px; top: 5px; pointer-events: none; }
.channels { display: flex; width: 148px; height: 28px; border: 1px solid #d3d9e3; border-radius: 6px; overflow: hidden; }
.channels input { width: 0; flex: 1; min-width: 0; height: 26px; padding: 3px 6px; font-family: "Theme MiSans Regular", MiSans, sans-serif; font-size: 12px; color: var(--secondary); border: 0; border-right: 1px solid #d3d9e3; outline: none; background: #fff; }
.channels input:focus { background: #fff6f0; }
.channels .opacity-field { display: flex; align-items: center; width: 50px; flex: none; color: var(--secondary); font-size: 12px; padding-right: 6px; }
.channels .opacity-field input { border: 0; padding-right: 0; }
.channels .hex-field { flex: 1; }
</style>
</head>

  <script>"use strict";
(() => {
  // src/palette-algorithm.js
  var clamp = (value, min = 0, max = 100) => Math.min(max, Math.max(min, value));
  var wrapHue = (hue2) => (hue2 % 360 + 360) % 360;
  function normalizeHex(value) {
    const normalized = value.trim().replace(/^#/, "");
    if (/^[\da-f]{3}$/i.test(normalized)) {
      return `#${normalized.split("").map((character) => character.repeat(2)).join("").toUpperCase()}`;
    }
    if (/^[\da-f]{6}$/i.test(normalized)) {
      return `#${normalized.toUpperCase()}`;
    }
    return null;
  }
  function hexToRgb(hex) {
    const normalized = normalizeHex(hex);
    if (!normalized) {
      throw new Error(`Invalid hex color: ${hex}`);
    }
    return {
      r: Number.parseInt(normalized.slice(1, 3), 16),
      g: Number.parseInt(normalized.slice(3, 5), 16),
      b: Number.parseInt(normalized.slice(5, 7), 16)
    };
  }
  function rgbToHex({ r, g, b }) {
    return `#${[r, g, b].map(
      (value) => Math.round(clamp(value, 0, 255)).toString(16).padStart(2, "0")
    ).join("").toUpperCase()}`;
  }
  function rgbToHsv({ r, g, b }) {
    const red = r / 255;
    const green = g / 255;
    const blue = b / 255;
    const max = Math.max(red, green, blue);
    const min = Math.min(red, green, blue);
    const delta = max - min;
    let h = 0;
    if (delta !== 0) {
      if (max === red) h = 60 * ((green - blue) / delta % 6);
      else if (max === green) h = 60 * ((blue - red) / delta + 2);
      else h = 60 * ((red - green) / delta + 4);
    }
    return {
      h: wrapHue(h),
      s: max === 0 ? 0 : delta / max * 100,
      v: max * 100
    };
  }
  function hsvToRgb({ h, s, v }) {
    const hue2 = wrapHue(h);
    const saturation = clamp(s) / 100;
    const value = clamp(v) / 100;
    const chroma = value * saturation;
    const x = chroma * (1 - Math.abs(hue2 / 60 % 2 - 1));
    const m = value - chroma;
    let rgb;
    if (hue2 < 60) rgb = [chroma, x, 0];
    else if (hue2 < 120) rgb = [x, chroma, 0];
    else if (hue2 < 180) rgb = [0, chroma, x];
    else if (hue2 < 240) rgb = [0, x, chroma];
    else if (hue2 < 300) rgb = [x, 0, chroma];
    else rgb = [chroma, 0, x];
    return {
      r: (rgb[0] + m) * 255,
      g: (rgb[1] + m) * 255,
      b: (rgb[2] + m) * 255
    };
  }
  function rgbToHsl({ r, g, b }) {
    const red = r / 255;
